name: Feature request
description: Suggest an improvement for Jisr
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain how you imagine the feature working.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform scope
      options:
        - Windows and macOS
        - Windows only
        - macOS only
        - Not platform-specific
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
